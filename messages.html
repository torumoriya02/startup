<body>
    <header>
        <h1>Find Babysitters</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Find a Babysitter</a>
            <a href="messages.html">Messages</a>
        </nav>
    </header>

    <main>
        <h2>Messages</h2>

        <section>
            <h3>Chat with Emma</h3>

            <!-- WebSocket realtime data placeholder -->
            <div>
                <p><strong>Emma:</strong> Hi! How can I help you?</p>
                <p><strong>Toru:</strong> Are you available this Friday?</p>
                <p><strong>Emma:</strong> Yes! I am available after 5 PM.</p>
            </div>

            <label for="message">Message:</label>
            <input
                type="text"
                id="message"
                placeholder="Type your message"
            >

            <button type="button">Send</button>

            <p>Realtime messages will appear here.</p>
        </section>
    </main>
