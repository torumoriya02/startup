<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Babysitter</title>
</head>

<body>
    <header>
        <h1>Find Babysitters</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Find a Babysitter</a>
            <a href="messages.html">Messages</a>
        </nav>
    </header>

    <main>
        <h2>Find a Babysitter Near You</h2>

        <section>
            <h3>Search</h3>

            <label for="location">Location:</label>
            <input type="text" id="location" placeholder="Provo, UT">

            <label for="date">Date:</label>
            <input type="date" id="date">

            <button type="button">Search</button>

            <!-- Third-party service placeholder -->
            <p>Map and location information will appear here.</p>
        </section>

        <section>
            <h3>Available Babysitters</h3>

            <!-- Database data placeholder -->
            <article>
                <img src="placeholder.png" alt="Babysitter profile" width="150">
                <h4>Emma</h4>
                <p>Rate: $18/hour</p>
                <p>Rating: 5/5</p>
                <a href="profile.html">View Profile</a>
            </article>

            <article>
                <img src="placeholder.png" alt="Babysitter profile" width="150">
                <h4>Sarah</h4>
                <p>Rate: $20/hour</p>
                <p>Rating: 4/5</p>
                <a href="profile.html">View Profile</a>
            </article>
        </section>
    </main>

    <footer>
        <p>Created by Toru Moriya</p>
        <a href="https://github.com/torumoriya02/startup">GitHub Repository</a>
    </footer>
</body>
</html>
