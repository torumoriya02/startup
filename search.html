<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SittersNearMe - Find Trusted Local Babysitters</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --accent: #fd79a8;
            --text: #2d3436;
            --bg: #f9f9fb;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 5%;
        }

        .search-section {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #636e72;
        }

        input, select {
            padding: 0.8rem;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            font-size: 1rem;
        }

        button.btn-search {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button.btn-search:hover {
            background-color: var(--secondary);
        }

        .results-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sitter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            height: 120px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            position: relative;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #eee;
            border: 4px solid var(--white);
            position: absolute;
            bottom: -40px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-body {
            padding: 50px 20px 20px 20px;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .name {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .rating {
            color: #f1c40f;
            font-weight: bold;
        }

        .meta {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 1rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            background: #f0f2f5;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .price {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
        }

        .btn-profile {
            display: block;
            width: 100%;
            text-align: center;
            padding: 0.8rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .btn-profile:hover {
            background: var(--primary);
            color: white;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            cursor: pointer;
            font-size: 1.5rem;
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            SittersNearMe
        </div>
        <nav>
            <a href="#" style="text-decoration: none; color: var(--text); font-weight: 500;">Login</a>
        </nav>
    </header>

    <main class="container">
        <section class="search-section">
            <h1 style="margin-bottom: 1.5rem;">Find a babysitter near you</h1>
            <div class="search-grid">
                <div class="input-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Enter Zip Code or City" value="Chicago, IL">
                </div>
                <div class="input-group">
                    <label for="date">When?</label>
                    <input type="date" id="date">
                </div>
                <div class="input-group">
                    <label for="experience">Experience</label>
                    <select id="experience">
                        <option value="any">Any Experience</option>
                        <option value="2">2+ Years</option>
                        <option value="5">5+ Years</option>
                        <option value="10">10+ Years</option>
                    </select>
                </div>
                <button class="btn-search" onclick="filterResults()">Search</button>
            </div>
        </section>

        <div class="results-header">
            <h2 id="results-count">Available Babysitters (4)</h2>
            <select style="padding: 5px; border-radius: 4px;">
                <option>Sort by: Recommended</option>
                <option>Price: Low to High</option>
                <option>Highest Rated</option>
            </select>
        </div>

        <section class="sitter-grid" id="sitter-list">
            <!-- Cards will be injected by JavaScript -->
        </section>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-name">Booking Request</h2>
            <p style="margin: 1rem 0;">You are requesting a booking with this sitter. Please confirm your details below.</p>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label>Message to Sitter</label>
                <textarea style="width: 100%; height: 80px; padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;"></textarea>
            </div>
            <button class="btn-search" style="width: 100%;" onclick="confirmBooking()">Send Request</button>
        </div>
    </div>

    <script>
        const sitters = [
            {
                id: 1,
                name: "Sarah Jenkins",
                rating: 4.9,
                reviews: 24,
                price: 22,
                distance: "0.8 miles away",
                tags: ["CPR Certified", "First Aid", "Non-smoker"],
                bio: "Experienced preschool teacher looking for weekend sitting."
            },
            {
                id: 2,
                name: "Michael Chen",
                rating: 4.8,
                reviews: 15,
                price: 18,
                distance: "1.2 miles away",
                tags: ["Has Car", "Homework Help", "Toddlers"],
                bio: "College student with 4 years of experience with all ages."
            },
            {
                id: 3,
                name: "Elena Rodriguez",
                rating: 5.0,
                reviews: 42,
                price: 25,
                distance: "2.5 miles away",
                tags: ["Bilingual", "Infant Care", "Cooks"],
                bio: "Professional nanny with 10+ years experience."
            },
            {
                id: 4,
                name: "Jessica Taylor",
                rating: 4.7,
                reviews: 8,
                price: 20,
                distance: "3.1 miles away",
                tags: ["Pet Friendly", "Arts & Crafts"],
                bio: "Energetic caregiver who loves outdoor activities."
            }
        ];

        function renderSitters(data) {
            const list = document.getElementById('sitter-list');
            const countText = document.getElementById('results-count');
            list.innerHTML = '';
            countText.innerText = `Available Babysitters (${data.length})`;

            data.forEach(sitter => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="avatar">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="#ccc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="name-row">
                            <span class="name">${sitter.name}</span>
                            <span class="rating">★ ${sitter.rating}</span>
                        </div>
                        <div class="meta">${sitter.distance} • ${sitter.reviews} reviews</div>
                        <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #444;">${sitter.bio}</p>
                        <div class="tags">
                            ${sitter.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <div class="price">$${sitter.price}/hr</div>
                        <button class="btn-profile" onclick="openModal('${sitter.name}')">Book Now</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterResults() {
            // Mock filtering effect
            const list = document.getElementById('sitter-list');
            list.style.opacity = '0.5';
            setTimeout(() => {
                list.style.opacity = '1';
                renderSitters(sitters);
            }, 300);
        }

        function openModal(name) {
            document.getElementById('modal-name').innerText = 'Request ' + name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function confirmBooking() {
            alert('Request sent successfully!');
            closeModal();
        }

        // Initialize
        document.getElementById('date').valueAsDate = new Date();
        renderSitters(sitters);

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
